services:
  - type: web
    name: ai-care-backend
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtOptions__SigningKey
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Storage__Provider
        value: Supabase
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Supabase__Bucket
        value: care-documents
      - key: Supabase__PublicFileBaseUrl
        sync: false
