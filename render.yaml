services:
  - type: web
    name: ai-care-backend
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: true
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtOptions__Issuer
        value: AiCare
      - key: JwtOptions__Audience
        value: AiCareClient
      - key: JwtOptions__SigningKey
        sync: false
      - key: Cors__AllowedOrigins__0
        value: https://ai-care-frontend.vercel.app
      - key: FamilyPortal__FrontendBaseUrl
        value: https://ai-care-frontend.vercel.app
      - key: Demo__Enabled
        value: false
      - key: TestingData__Enabled
        value: true
      - key: Monitoring__SlowRequestThresholdMs
        value: 2000
      - key: Storage__Provider
        value: Supabase
      - key: Documents__MaxUploadBytes
        value: 10485760
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Supabase__Bucket
        value: care-documents
