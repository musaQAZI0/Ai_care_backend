name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicare_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicare_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AiCare.Backend.sln

      - name: Build
        run: dotnet build AiCare.Backend.sln --configuration Release --no-restore

      - name: Existing tests
        run: dotnet test AiCare.Backend.sln --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName!~ProductionRegressionTests&FullyQualifiedName!~CarePlanLifecycleRegressionTests&FullyQualifiedName!~CarePlanSupersedingRegressionTests"

      - name: PostgreSQL production regression tests
        run: dotnet test AiCare.Backend.sln --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName~ProductionRegressionTests|FullyQualifiedName~CarePlanLifecycleRegressionTests|FullyQualifiedName~CarePlanSupersedingRegressionTests"
        env:
          AICARE_REGRESSION_CONNECTION: Host=localhost;Port=5432;Database=aicare_regression;Username=postgres;Password=postgres
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=aicare_regression;Username=postgres;Password=postgres
          JwtOptions__Issuer: AiCare
          JwtOptions__Audience: AiCareClient
          JwtOptions__SigningKey: regression-signing-key-with-enough-length-for-hmac-2026
          JwtOptions__TokenLifetimeMinutes: '30'
          Storage__Provider: Local
          ASPNETCORE_ENVIRONMENT: Development

      - name: Build production container
        run: docker build --pull --tag aicare-backend:ci .
