name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicare_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicare_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AICARE_REGRESSION_CONNECTION: Host=localhost;Port=5432;Database=aicare_regression;Username=postgres;Password=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AiCare.Backend.sln

      - name: Build
        run: dotnet build AiCare.Backend.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AiCare.Backend.sln --configuration Release --no-build --verbosity normal
