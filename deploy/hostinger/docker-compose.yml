services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    image: ${AICARE_MIGRATOR_IMAGE:-aicare-migrator:local}
    profiles: ["migration"]
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  backend:
    image: ${AICARE_BACKEND_IMAGE:-aicare-backend:local}
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "8080"
    networks: [internal]

  frontend:
    image: ${AICARE_FRONTEND_IMAGE:-aicare-frontend:local}
    restart: unless-stopped
    expose:
      - "80"
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      AICARE_DOMAIN: ${AICARE_DOMAIN}
      AICARE_API_DOMAIN: ${AICARE_API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [internal]

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  letsencrypt:
  certbot_www:
